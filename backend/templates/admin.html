<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Gate Access System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-gray-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold">Gate Access System</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm">Logged in as: {{ role }}</span>
                    <a href="{{ url_for('logout') }}" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-2 rounded text-sm">Logout</a>
                    {% if role == "admin" %}
                    <a href="{{ url_for('add_user') }}" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded text-sm">Add User</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Unknown Visitors</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for person in persons %}
            <div class="bg-white shadow-md rounded-lg overflow-hidden">
                <img src="{{ url_for('serve_image', person=person.name, filename=person.image) }}" class="w-full h-48 object-cover" alt="{{ person.name }}">
                <div class="p-4">
                    <h5 class="text-lg font-semibold text-gray-800 mb-3">{{ person.name }}</h5>
                    {% if role == "admin" %}
                    <form action="{{ url_for('approve', person=person.name) }}" method="post" class="mb-3">
                        <input type="text" name="name" class="w-full px-3 py-2 border border-gray-300 rounded mb-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter Name" required>
                        <button type="submit" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded text-sm mr-2">Approve</button>
                    </form>
                    <a href="{{ url_for('reject', person=person.name) }}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded text-sm inline-block">Reject</a>
                    {% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
